<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const mobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const renderer=new THREE.WebGLRenderer({antialias:!mobile,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.5:2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xc58d5c,35,150);
const camera=new THREE.PerspectiveCamera(60,1,.1,200);camera.position.set(0,5,9);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<.8?74:60;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const hemi=new THREE.HemisphereLight(0xffe4c4,0x44553a,1.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(-3,8,5);scene.add(sun);

const bendU={value:0};
const M=(c,e)=>{const m=new THREE.MeshLambertMaterial({color:c,emissive:e||0});
  m.onBeforeCompile=s=>{s.uniforms.uBend=bendU;s.vertexShader='uniform float uBend;\n'+s.vertexShader.replace('#include <project_vertex>','#include <project_vertex>\nfloat dd=max(-mvPosition.z-10.0,0.0);mvPosition.x+=uBend*dd*dd*.0014;mvPosition.y-=dd*dd*.00045;gl_Position=projectionMatrix*mvPosition;')};
  return m};
const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d), cyl=(a,b,h,s)=>new THREE.CylinderGeometry(a,b,h,s);
const mk=(g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o};
const LANES=[-2.2,0,2.2],SEG=20,NSEG=10;

/* ---------- Road segments (recycled) ---------- */
const gStone=box(7,.5,SEG),gGround=box(70,.5,SEG),gEdge=box(.5,.7,SEG),gLine=box(.08,.02,SEG);
const gTrunk=cyl(.25,.35,2.2,6),gLeaf=new THREE.ConeGeometry(1.4,3.2,6),gPillar=cyl(.5,.6,4,8),gCap=box(1.8,.4,1.8);
const mA=M(0x9a8f7c),mB=M(0x8c8270),mGr=M(0x2f5a2a),mEdge=M(0x6d6455),mLine=M(0x5a5246),mTrunk=M(0x5b3a1e),mLeaf=M(0x2e7d32),mStat=M(0xb5aa94);
function noiseTex(rx,ry){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),im=x.createImageData(128,128);
  for(let i=0;i<im.data.length;i+=4){const v=195+Math.random()*60;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}
  x.putImageData(im,0,0);x.strokeStyle='rgba(50,50,50,.5)';x.lineWidth=2;
  for(let i=0;i<8;i++){x.beginPath();x.moveTo(Math.random()*128,Math.random()*128);x.lineTo(Math.random()*128,Math.random()*128);x.stroke()}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t}
mA.map=mB.map=noiseTex(3,8);mGr.map=noiseTex(14,4);
const mLeaf2=M(0x1f5e26),gBush=new THREE.IcosahedronGeometry(.7,0),gLeaf2=new THREE.ConeGeometry(1,2.4,6);
const segs=[];
for(let i=0;i<NSEG;i++){
  const g=new THREE.Group();
  g.add(mk(gGround,mGr,0,-.8,0),mk(gStone,i%2?mA:mB,0,-.25,0),mk(gEdge,mEdge,-3.6,-.05,0),mk(gEdge,mEdge,3.6,-.05,0),mk(gLine,mLine,-1.1,.02,0),mk(gLine,mLine,1.1,.02,0));
  g.deco=[];
  for(let s=0;s<4;s++){
    const d=new THREE.Group(),t=new THREE.Group(),p=new THREE.Group();
    t.add(mk(gTrunk,mTrunk,0,1.1,0),mk(gLeaf,mLeaf,0,3.4,0),mk(gLeaf2,mLeaf2,0,5,0),mk(gBush,mLeaf2,1,2.4,.3),mk(gBush,mLeaf,-.9,2.2,-.2));
    p.add(mk(gPillar,mStat,0,2,0),mk(gCap,mStat,0,4.1,0));
    d.add(t,p);d.t=t;d.p=p;d.side=s<2?-1:1;g.add(d);g.deco.push(d);
  }
  g.bush=[];for(let s=0;s<6;s++){const b=mk(gBush,s%2?mLeaf2:mStat);g.add(b);g.bush.push(b)}
  scene.add(g);segs.push(g);
}
function decorate(g){
  g.bush.forEach((b,i)=>{b.scale.setScalar(.5+Math.random()*.8);b.position.set((i%2?1:-1)*(4.3+Math.random()*1.6),.2,(Math.random()-.5)*SEG)});
  for(const d of g.deco){
    const r=Math.random();
    d.t.visible=r<.6;d.p.visible=r>=.6&&r<.85;
    const sc=.8+Math.random()*.6;d.t.scale.setScalar(sc);d.p.scale.y=.5+Math.random()*.5;
    d.position.set(d.side*(6+Math.random()*8),-.55,(Math.random()-.5)*SEG*.9);
  }
}

/* ---------- Obstacles (pooled) ---------- */
const mStone=M(0x7d7566),mDark=M(0x0b0b0e),mRim=M(0x6a2a10,0x2a0d00),mSpike=M(0xcfd3d8),mBeam=M(0x8a5a2b);
const DEFS={
  pit:{hw:1,hd:1.5,y0:-1,y1:.2,build:g=>{g.add(mk(box(2.2,.04,3.2),mRim,0,.01,0),mk(box(1.9,.06,2.9),mDark,0,.03,0))}},
  low:{hw:.9,hd:.4,y0:0,y1:1,build:g=>{g.add(mk(box(1.8,1,.8),mStone,0,.5,0),mk(box(1.9,.15,.9),mStat,0,1.02,0))}},
  spike:{hw:.9,hd:.6,y0:0,y1:.8,build:g=>{const gc=new THREE.ConeGeometry(.2,.9,5);g.add(mk(box(1.8,.1,1.2),mStone,0,.05,0));for(let i=0;i<6;i++)g.add(mk(gc,mSpike,-.75+i*.3,.55,i%2?.25:-.25))}},
  beam:{hw:1,hd:.3,y0:1.4,y1:2.1,build:g=>{const gp=box(.3,2.2,.3);g.add(mk(gp,mStone,-1,1.1,0),mk(gp,mStone,1,1.1,0),mk(box(2.4,.6,.4),mBeam,0,1.75,0))}},
  pillar:{hw:.8,hd:.8,y0:0,y1:4,build:g=>{g.add(mk(cyl(.75,.85,3.6,8),mStat,0,1.8,0),mk(box(1.8,.4,1.8),mStone,0,3.8,0))}}
};
const TYPES=Object.keys(DEFS),allObs=[];
for(const t of TYPES)for(let i=0;i<8;i++){
  const g=new THREE.Group();DEFS[t].build(g);g.visible=false;scene.add(g);
  allObs.push({g,type:t,...DEFS[t]});
}
const getObs=t=>allObs.find(o=>o.type===t&&!o.g.visible);

/* ---------- Coins (pooled) ---------- */
function coinTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const g=x.createRadialGradient(50,44,6,64,64,64);g.addColorStop(0,'#fff6b8');g.addColorStop(.55,'#ffc926');g.addColorStop(1,'#a8740a');
  x.fillStyle=g;x.beginPath();x.arc(64,64,64,0,7);x.fill();
  x.strokeStyle='#8a5e08';x.lineWidth=5;x.beginPath();x.arc(64,64,52,0,7);x.stroke();x.lineWidth=2;x.beginPath();x.arc(64,64,44,0,7);x.stroke();
  x.fillStyle='#c9930c';x.strokeStyle='#fff0a0';x.lineWidth=2;x.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?12:30;x.lineTo(64+Math.cos(a)*r,64+Math.sin(a)*r)}
  x.closePath();x.fill();x.stroke();const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const mCoinB=new THREE.MeshPhongMaterial({color:0xffc926,emissive:0x442d00,shininess:120,specular:0xffffaa});
const mCoinF=new THREE.MeshPhongMaterial({map:coinTex(),emissive:0x332200,shininess:90,specular:0xffffaa});
mCoinB.onBeforeCompile=mCoinF.onBeforeCompile=M(0).onBeforeCompile;
const gCB=cyl(.4,.4,.07,20),gRim=new THREE.TorusGeometry(.4,.045,8,24),gFace=new THREE.CircleGeometry(.34,24);gCB.rotateX(Math.PI/2);
function mkCoin(){const g=new THREE.Group();g.add(mk(gCB,mCoinB),mk(gRim,mCoinB));const f=mk(gFace,mCoinF,0,0,.04),b=mk(gFace,mCoinF,0,0,-.04);b.rotation.y=Math.PI;g.add(f,b);return g}
const coinPool=[];
for(let i=0;i<48;i++){const c=mkCoin();c.visible=false;scene.add(c);coinPool.push(c)}
function spawnCoins(x,z,n){for(let i=0;i<n;i++){const c=coinPool.find(c=>!c.visible);if(!c)return;c.visible=true;c.position.set(x,1,z-i*1.8)}}

/* ---------- Player (primitives, with fallback) ---------- */
function buildPlayer(){
  const g=new THREE.Group();
  try{
    const red=M(0xe02020),skin=M(0xf1c27d),brown=M(0x6b3f1d),dark=M(0x2a2a3a),org=M(0xff9f1c);
    const limb=(w,h,m,x,y)=>{const p=new THREE.Group();p.position.set(x,y,0);p.add(mk(box(w,h,w),m,0,-h/2,0));g.add(p);return p};
    g.legL=limb(.25,.55,dark,-.17,.55);g.legR=limb(.25,.55,dark,.17,.55);
    g.armL=limb(.2,.6,red,-.48,1.32);g.armR=limb(.2,.6,red,.48,1.32);
    g.add(mk(box(.7,.8,.4),red,0,.95,0),mk(box(.72,.12,.42),dark,0,.62,0),mk(box(.45,.5,.2),org,0,1,.3),
      mk(new THREE.SphereGeometry(.28,10,8),skin,0,1.63,0),mk(cyl(.42,.42,.06,10),brown,0,1.82,0),mk(cyl(.24,.26,.22,10),brown,0,1.95,0),
      mk(box(.08,.08,.05),dark,-.1,1.66,-.27),mk(box(.08,.08,.05),dark,.1,1.66,-.27));
  }catch(e){
    while(g.children.length)g.remove(g.children[0]);g.legL=g.legR=g.armL=g.armR=null;
    g.add(mk(box(.8,1.8,.6),M(0xe02020),0,.9,0));
  }
  return g;
}
function buildHero(){
  try{
    const P=(c,s)=>new THREE.MeshPhongMaterial({color:c,shininess:s||18});
    const red=P(0xd91e1e,30),dRed=P(0x8f1212),skin=P(0xf0c08a,8),pants=P(0x3b2f2a),boot=P(0x1e1612),brown=P(0x6b3f1d),gold=P(0xffc926,80),org=P(0xe8871e),hair=P(0x2b1a10),blk=P(0x111111);
    const g=new THREE.Group();
    const cap=(r,l,m,x,y,z,sz)=>{const o=mk(new THREE.CapsuleGeometry(r,l,4,10),m,x,y,z);if(sz)o.scale.z=sz;return o};
    const limb=(r,l,m,x,y,hand)=>{const p=new THREE.Group();p.position.set(x,y,0);p.add(cap(r,l,m,0,-(l/2+r),0));if(hand)p.add(mk(new THREE.SphereGeometry(r*1.05,8,6),hand,0,-(l+2*r),0));return p};
    g.legL=limb(.14,.3,pants,-.17,.62);g.legR=limb(.14,.3,pants,.17,.62);
    for(const l of [g.legL,g.legR])l.add(mk(box(.27,.14,.42),boot,0,-.55,-.07));
    g.armL=limb(.1,.3,red,-.46,1.34,skin);g.armR=limb(.1,.3,red,.46,1.34,skin);
    const belt=mk(cyl(.3,.3,.1,12),brown,0,.62,0);belt.scale.z=.68;
    const hat=mk(cyl(.42,.42,.04,14),brown,0,1.86,0);
    const scarf=mk(new THREE.TorusGeometry(.2,.05,6,12),org,0,1.5,0);scarf.rotation.x=Math.PI/2;
    const roll=mk(cyl(.09,.09,.5,8),brown,0,1.38,.3);roll.rotation.z=Math.PI/2;
    g.add(g.legL,g.legR,g.armL,g.armR,cap(.3,.3,red,0,1,0,.68),belt,mk(box(.1,.08,.02),gold,0,.62,-.21),mk(box(.06,.7,.02),dRed,0,1,-.21),scarf,
      mk(new THREE.SphereGeometry(.25,12,10),skin,0,1.7,0),mk(new THREE.SphereGeometry(.265,12,8,0,Math.PI*2,0,Math.PI*.55),hair,0,1.72,.01),
      hat,mk(cyl(.24,.27,.2,12),brown,0,1.96,0),mk(cyl(.275,.275,.05,12),red,0,1.89,0),
      mk(new THREE.SphereGeometry(.03,6,5),blk,-.09,1.72,-.23),mk(new THREE.SphereGeometry(.03,6,5),blk,.09,1.72,-.23),
      mk(box(.44,.55,.2),org,0,1.05,.28),roll);
    return g;
  }catch(e){return buildPlayer()}
}
let save={w:40,own:['explorer','stone','jungle'],ch:'explorer',road:'stone'};

  x.fillStyle=g;x.fillRect(0,0,150,110);x.fillStyle=hx(W.gr);x.fillRect(0,50,150,60);
  x.fillStyle=hx(W.a);x.beginPath();x.moveTo(62,50);x.lineTo(88,50);x.lineTo(118,110);x.lineTo(32,110);x.fill();
  x.fillStyle=hx(W.trunk);x.fillRect(18,40,6,14);x.fillRect(122,40,6,14);
  x.fillStyle=hx(W.leaf);[21,125].forEach(a=>{x.beginPath();x.moveTo(a,16);x.lineTo(a-15,44);x.lineTo(a+15,44);x.fill()});
  return icons[k]=c.toDataURL();
}
const SRC={ch:CH,rd:ROADS,wd:WORLDS},CURK={ch:'ch',rd:'road',wd:'mode'},ICON={ch:charIcon,rd:roadIcon,wd:worldIcon};
if(!save.mode)save.mode='jungle';
let tab='ch';
function renderStore(){
  $('wal').textContent=save.w;
  const src=SRC[tab],cur=save[CURK[tab]];
  $('items').innerHTML=Object.keys(src).map(k=>{const it=src[k],own=save.own.includes(k);
    return `<div class='it${cur===k?' on':''}'><img alt='' src='${ICON[tab](k)}'><b>${it.n}</b><button data-k='${k}'>${cur===k?'SELECTED':own?'SELECT':'BUY '+it.p}</button></div>`}).join('');
  $('tc').classList.toggle('on',tab==='ch');$('tr').classList.toggle('on',tab==='rd');$('tw').classList.toggle('on',tab==='wd');
}
$('ob3').addEventListener('click',()=>{$('store').style.display='flex';renderStore()});
$('sx').addEventListener('click',()=>{$('store').style.display='none'});
$('tw').addEventListener('click',()=>{tab='wd';renderStore()});
$('tc').addEventListener('click',()=>{tab='ch';renderStore()});$('tr').addEventListener('click',()=>{tab='rd';renderStore()});
$('items').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,src=SRC[tab];
  if(!save.own.includes(k)){if(save.w<src[k].p){b.textContent='NEED MORE COINS';return}save.w-=src[k].p;save.own.push(k)}
  if(tab==='ch')setChar(k);else if(tab==='rd'){save.road=k;setMode(modeId)}else{save.mode=k;setMode(k)}
  persist();renderStore();
});

/* ---------- Controls ---------- */
const moveLane=d=>{if(state==='play')lane=Math.max(0,Math.min(2,lane+d))};
const jump=()=>{if(state==='play'&&py<=.001){vy=JV;slide=0}};
const doSlide=()=>{if(state!=='play')return;if(py>.01)vy=-30;slide=.75};
addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowLeft','a','A'].includes(k))moveLane(-1);
  else if(['ArrowRight','d','D'].includes(k))moveLane(1);
  else if(['ArrowUp','w','W',' '].includes(k)){if(state==='ready'||state==='over')start();else jump()}
  else if(['ArrowDown','s','S'].includes(k))doSlide();
  else if(k==='Enter'&&(state==='ready'||state==='over'))start();
  if(k.startsWith('Arrow')||k===' ')e.preventDefault();
});
// swipe anywhere on screen: fires instantly once finger moves far enough, then re-anchors for chained swipes
let sx=0,sy=0,sd=false;
addEventListener('pointerdown',e=>{if(e.target.closest('#ov,#store,#mn'))return;sx=e.clientX;sy=e.clientY;sd=true});
addEventListener('pointermove',e=>{
  if(!sd)return;const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))moveLane(dx>0?1:-1);else if(dy<0)jump();else doSlide();
  sx=e.clientX;sy=e.clientY;
});
addEventListener('pointerup',()=>sd=false);addEventListener('pointercancel',()=>sd=false);
document.addEventListener('touchmove',e=>{if(!e.target.closest('#items'))e.preventDefault()},{passive:false});
['gesturestart','gesturechange','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));

/* ---------- Update loop ---------- */
function update(dt,now){
  const play=state==='play';
  if(play){
    speed=Math.min(MODE.max,speed+MODE.acc*dt);
    const d=speed*dt;dist+=d;sinceRow+=d;
    curveT-=dt;if(curveT<=0){curveTarget=[-1,-.6,0,.6,1][Math.random()*5|0];curveT=4+Math.random()*4}
    curve+=(curveTarget-curve)*Math.min(1,dt*.7);bendU.value=curve;
    for(const s of segs){s.position.z+=d;if(s.position.z>20){s.position.z-=SEG*NSEG;decorate(s)}}
    for(const o of allObs)if(o.g.visible){o.g.position.z+=d;if(o.g.position.z>12)o.g.visible=false}
    for(const c of coinPool)if(c.visible){c.position.z+=d;if(pw.mag>0&&c.position.z>-16&&c.position.z<2)c.position.x+=(px-c.position.x)*Math.min(1,dt*7);if(c.position.z>10)c.visible=false}
    for(const o of orbPool)if(o.visible){o.position.z+=d;o.rotation.y+=dt*3;o.position.y=1.3+Math.sin(performance.now()/300+o.id)*.15;if(o.position.z>10)o.visible=false}
    const rowGap=20+speed*.55;
    if(sinceRow>=rowGap){sinceRow-=rowGap;spawnRow(-100+sinceRow)}
    // player motion
    px+=(LANES[lane]-px)*Math.min(1,dt*13);
    if(py>0||vy>0){vy-=G*dt;py+=vy*dt;if(py<=0){py=0;vy=0}}
    if(slide>0)slide-=dt;if(inv>0)inv-=dt;gap=.7+.55*Math.sin(dist/70);for(const k in pw)if(pw[k]>0)pw[k]-=dt;
    // collisions (AABB)
    const ph=slide>0?SLIDEH:STAND;
    for(const o of allObs){
      if(!o.g.visible)continue;const p=o.g.position;
      if(Math.abs(p.x-px)<o.hw+.4&&Math.abs(p.z)<o.hd+.4&&py<o.y1&&py+ph>o.y0){
        if(inv>0)continue;
        if(pw.shield>0){pw.shield=0;inv=1.2;if(o.type!=='pit')o.g.visible=false;continue}
        die(o.type==='pit'?'You fell into a pit!':'You hit an obstacle!');break;
      }
    }
    for(const c of coinPool){
      if(!c.visible)continue;const p=c.position;
      if(Math.abs(p.x-px)<.8&&Math.abs(p.z)<.8&&py<1.4&&py+ph>.6){c.visible=false;coins+=pw.x2>0?2:1}
    }
    for(const o of orbPool){if(!o.visible)continue;const p=o.position;if(Math.abs(p.x-px)<.9&&Math.abs(p.z)<.9&&py<1.8&&py+ph>.4){o.visible=false;pw[o.kind]=o.kind==='shield'?14:9}}
    runT+=dt*(9+speed*.6);
  }
  for(const c of coinPool)if(c.visible)c.rotation.y+=dt*4;
  // player visuals
  player.position.set(px,py+(slide>0?.2:(state==='play'&&py<.05?Math.abs(Math.sin(runT))*.08:0)),0);player.visible=inv<=0||state!=='play'||((performance.now()/90|0)%2===0);
  if(state!=='over'){
    
    player.rotation.z=(px-LANES[lane])*.12;
    player.rotation.x+=((slide>0?1.35:(state==='play'&&py<.05?-.2:0))-player.rotation.x)*Math.min(1,dt*(slide>0?22:10));
    const sw=slide>0?0:(py>.05?.9:Math.sin(runT)*1.15);
    if(player.legL){player.legL.rotation.x=sw;player.legR.rotation.x=-sw;player.armL.rotation.x=-sw;player.armR.rotation.x=sw;
      if(player.legL.knee){player.legL.knee.rotation.x=-(.15+Math.max(0,-sw)*1.1);player.legR.knee.rotation.x=-(.15+Math.max(0,sw)*1.1);player.armL.elb.rotation.x=.9+Math.max(0,sw)*.4;player.armR.elb.rotation.x=.9+Math.max(0,-sw)*.4}}
  }else{player.rotation.x+=(-1.3-player.rotation.x)*Math.min(1,dt*8)}
  camera.position.x+=(px*.4-camera.position.x)*Math.min(1,dt*6);camera.lookAt(px*.2,1.4,-9);updLion(dt);bubble.visible=pw.shield>0;bubble.position.set(px,py+1,0);
  // HUD
  const s='Score: '+(Math.floor(dist)+coins*10),di='Distance: '+Math.floor(dist)+'m',co=String(coins);
  if(s!==hudS){$('sc').textContent=hudS=s}
  if(di!==hudD){$('di').textContent=hudD=di}
  if(co!==hudC){$('co').textContent=hudC=co}
  let ph2='';for(const k in pw)if(pw[k]>0)ph2+=`<div class='row'>${PWI[k]}<span>${Math.ceil(pw[k])}s</span></div>`;
  if(ph2!==hudP){$('pw').innerHTML=hudP=ph2}
}
function frame(now){
  requestAnimationFrame(frame);
  const raw=Math.min(.05,(now-last)/1000);last=now;sdt+=(raw-sdt)*.35;const dt=sdt;
  update(dt,now);renderer.render(scene,camera);
}
scene.traverse(o=>{o.frustumCulled=false});
allObs.forEach(o=>o.g.visible=true);coinPool.forEach(c=>c.visible=true);orbPool.forEach(o=>o.visible=true);
renderer.compile(scene,camera);renderer.render(scene,camera);
reset();requestAnimationFrame(frame);
</script>
