<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #87ceeb;
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;

  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  button { font-family: inherit; touch-action: manipulation; }
  .hidden { display: none !important; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left));
    pointer-events: none; z-index: 5;
  }
  .stat {
    display: flex; align-items: center; gap: 8px; color: #fff; font-weight: 800;
    font-size: clamp(15px, 4.4vw, 24px); background: rgba(0,0,0,.45);
    padding: 6px 14px; border-radius: 14px; text-shadow: 0 2px 4px rgba(0,0,0,.5);
  }
  .coin-icon {
    width: 1.1em; height: 1.1em; border-radius: 50%; display: inline-block; box-sizing: border-box;
    background: radial-gradient(circle at 35% 30%, #fff6a8, #ffc800 55%, #b8860b);
    border: 2px solid #fff3b0; box-shadow: 0 0 6px rgba(255,200,0,.8);
  }
  #btnPause {
    position: fixed; z-index: 6; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: 48px; height: 48px; border-radius: 50%; padding: 0; cursor: pointer;
    border: 2px solid rgba(255,255,255,.9); background: rgba(0,0,0,.5); color: #fff;
    font-size: 16px; font-weight: 900; letter-spacing: -2px;
  }
  #prog {
    position: fixed; z-index: 4; top: calc(70px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: min(68vw, 360px); height: 12px; background: rgba(0,0,0,.5); border-radius: 8px;
    border: 1px solid rgba(255,255,255,.65); pointer-events: none;
  }
  #progFill { height: 100%; width: 0; background: linear-gradient(90deg, #ffd23a, #ff4a4a); border-radius: 8px; }
  #progFlag { position: absolute; right: -8px; top: -13px; font-size: 20px; }
  #levelTag {
    position: fixed; z-index: 4; top: calc(90px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    color: #fff; font-weight: 800; font-size: 12px; letter-spacing: 1px; padding: 3px 12px; white-space: nowrap;
    background: rgba(0,0,0,.45); border-radius: 10px; pointer-events: none;
  }
  #speedo {
    position: fixed; z-index: 4; bottom: calc(26px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    color: #fff; font-weight: 900; font-size: 20px; letter-spacing: 1px; padding: 4px 14px;
    background: rgba(0,0,0,.45); border-radius: 12px; pointer-events: none;
  }
  #toast {
    position: fixed; left: 50%; top: calc(120px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 12;
    padding: 8px 18px; background: rgba(0,0,0,.65); color: #fff; border-radius: 14px; font-weight: 800;
    font-size: clamp(14px, 4vw, 20px); text-align: center; max-width: 90vw; opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* ---------- touch controls ---------- */
  #controls {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between;
    padding: 0 calc(14px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    pointer-events: none; z-index: 5;
  }
  .ctl {
    pointer-events: auto; width: clamp(76px, 22vw, 120px); height: clamp(76px, 22vw, 120px);
    border-radius: 50%; border: 3px solid rgba(255,255,255,.85); background: rgba(0,0,0,.35);
    color: #fff; font-size: clamp(32px, 9vw, 48px); line-height: 1; padding: 0; cursor: pointer;
    touch-action: none; backdrop-filter: blur(2px);
  }

  @media (pointer: fine) { .ctl { opacity: .55; width: 84px; height: 84px; } }
  #hint { position: fixed; bottom: 8px; width: 100%; text-align: center; color: rgba(255,255,255,.8); font-size: 12px; z-index: 3; pointer-events: none; }
  @media (pointer: coarse) { #hint { display: none; } }

  /* ---------- menus ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; justify-content: safe center; gap: 14px; text-align: center; color: #fff;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    box-sizing: border-box; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  }
  .btnrow { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .menubtn {
    font-size: clamp(17px, 5vw, 24px); font-weight: 800; min-width: min(66vw, 260px);

    border: 3px solid #fff; border-radius: 40px; cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.45);

  .menubtn.alt { background: linear-gradient(#4a5568, #222a35); min-width: 0; }
  .menubtn.buy { background: linear-gradient(#ffd23a, #d49a00); color: #3a2a00; }

  .title {
    font-size: clamp(44px, 13vw, 88px); line-height: .95; font-style: italic; letter-spacing: 2px; color: #fff;

  #bestLine, #finalScore, #finalScore2 { font-size: clamp(16px, 4.6vw, 24px); font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.6); }

  #gameover, #pause, #levelwin { background: rgba(0,0,0,.62); }
  #levels { background: rgba(0,0,0,.6); }
  #gameover h1 { font-size: clamp(44px, 14vw, 96px); color: #ff3030; letter-spacing: 2px; text-shadow: 0 4px 0 #6b0000, 0 8px 18px rgba(0,0,0,.6); }
  #levelwin h1 { font-size: clamp(34px, 10vw, 72px); color: #ffd23a; text-shadow: 0 4px 0 #6b4a00, 0 8px 18px rgba(0,0,0,.6); }

  #garage, #roads { background: none; justify-content: space-between; }
  .toprow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #garage h2, #roads h2 { background: rgba(0,0,0,.45); padding: 6px 22px; border-radius: 16px; }
  .gbottom { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  #vName, #rName { font-size: clamp(18px, 5vw, 26px); font-weight: 800; background: rgba(0,0,0,.5); padding: 4px 18px; border-radius: 14px; }
  #vStats, #rStats { font-size: 13px; background: rgba(0,0,0,.45); padding: 3px 12px; border-radius: 10px; }
  .hscroll {
    display: flex; gap: 10px; overflow-x: auto; max-width: 96vw; padding: 8px 6px; box-sizing: border-box;
    touch-action: pan-x; -webkit-overflow-scrolling: touch; scrollbar-width: thin;
  }
  .vcard, .rcard {
    flex: 0 0 auto; width: 112px; min-height: 62px; border-radius: 14px; border: 3px solid rgba(255,255,255,.6);
    background: rgba(0,0,0,.55); color: #fff; padding: 6px; cursor: pointer; display: flex; flex-direction: column;
    gap: 4px; align-items: center; justify-content: center; font-weight: 800; text-shadow: 0 1px 3px #000;
  }
  .vn { font-size: 13px; } .vp { font-size: 12px; opacity: .95; }
  .lockd { opacity: .78; }
  #swatches { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 420px; }
  .sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7); cursor: pointer; padding: 0; }
  .sel { border-color: #fff !important; box-shadow: 0 0 0 3px #ffcf33, 0 4px 10px rgba(0,0,0,.5); transform: scale(1.06); }

  .lvgrid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: min(92vw, 420px); max-height: 62vh;
    overflow-y: auto; padding: 8px; box-sizing: border-box; touch-action: pan-y;
    background: rgba(0,0,0,.35); border-radius: 16px; -webkit-overflow-scrolling: touch;
  }
  .lv {
    aspect-ratio: 1; border-radius: 12px; border: 2px solid #fff; color: #fff; font-weight: 800; font-size: 18px; cursor: pointer; padding: 0;
    background: linear-gradient(#ff4a4a, #c40000);
  }
  .lv.lock { background: #444; border-color: #777; color: #999; cursor: not-allowed; }
  .lv.cur { box-shadow: 0 0 0 3px #ffcf33; }
  @media (orientation: landscape) { .lvgrid { grid-template-columns: repeat(10, 1fr); width: min(94vw, 640px); } }

  @media (max-height: 520px) {
    .overlay { gap: 8px; }
    .title { font-size: 38px; } .title br { display: none; }
    .menubtn { padding: 8px 20px; font-size: 16px; min-width: 0; }
    #gameover h1 { font-size: 40px; } #levelwin h1 { font-size: 34px; }
    .sw { width: 32px; height: 32px; } .vcard, .rcard { min-height: 50px; width: 100px; }
    .lvgrid { max-height: 50vh; } #hint, #speedo { display: none; }
  }
  #loading { background: #87ceeb; color: #fff; font-size: 22px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.4); z-index: 20; }
</style>

/* ================================================================== *
 *  Generic geometry helpers + merged "Parts" builder  (vehicles & scenery)
 * ================================================================== */
/*VEH-BEGIN*/
const _V = new THREE.Vector3(), _Q = new THREE.Quaternion(), _E = new THREE.Euler(), _S = new THREE.Vector3(), _M = new THREE.Matrix4();
const I4 = new THREE.Matrix4();
class Parts {
  constructor() { this.list = []; }
  addM(geo, hex, m4) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    g.applyMatrix4(m4);
    for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal' && k !== 'uv') g.deleteAttribute(k);
    const c = new THREE.Color(hex), n = g.attributes.position.count, a = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(a, 3));
    this.list.push(g);
    return this;
  }
  add(geo, hex, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
    _E.set(rx, ry, rz); _Q.setFromEuler(_E); _V.set(x, y, z); _S.set(sx, sy, sz); _M.compose(_V, _Q, _S);
    return this.addM(geo, hex, _M);
  }
  limb(a, b, r, hex, seg = 8) {                     // cylinder between two points
    const A = new THREE.Vector3(a[0], a[1], a[2]), B = new THREE.Vector3(b[0], b[1], b[2]);
    const dir = B.clone().sub(A), len = dir.length();
    if (len < 1e-4) return this;
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    const m = new THREE.Matrix4().compose(A.clone().add(B).multiplyScalar(0.5), q, new THREE.Vector3(1, 1, 1));
    return this.addM(new THREE.CylinderGeometry(r, r, len, seg), hex, m);
  }
  merge() {
    if (!this.list.length) return null;
    const g = mergeGeometries(this.list, false);
    this.list.forEach(x => x.dispose()); this.list = [];
    return g;
  }
}
const bx = (w, h, d) => new THREE.BoxGeometry(w, h, d);

// Side profile (u = along the car, +u = front; v = height) extruded across the width.
function profileGeo(pts, width, bevel = 0.04) {
  const sh = new THREE.Shape();
  pts.forEach(([u, v], i) => (i ? sh.lineTo(u, v) : sh.moveTo(u, v)));
  sh.closePath();
  const depth = Math.max(0.05, width - bevel * 2);
  const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 6 });
  g.translate(0, 0, -depth / 2);
  g.rotateY(Math.PI / 2);            // shape-x -> -z (front), extrude -> x
  return g;
}

const wheelCache = {};
function wheelGeo(r, w, rim = 0xc9ced4, lugs = 0) {
  const key = [r, w, rim, lugs].join('_');
  if (wheelCache[key]) return wheelCache[key];
  const P = new Parts(), rz = Math.PI / 2;
  P.add(new THREE.CylinderGeometry(r, r, w, 24), 0x141414, 0, 0, 0, 0, 0, rz);
  P.add(new THREE.CylinderGeometry(r * 0.64, r * 0.64, w * 1.03, 20), rim, 0, 0, 0, 0, 0, rz);
  P.add(new THREE.CylinderGeometry(r * 0.24, r * 0.24, w * 1.07, 10), 0x2a2a2a, 0, 0, 0, 0, 0, rz);
  for (let k = 0; k < 5; k++) {
    const b = bx(w * 1.06, r * 0.44, r * 0.1); b.translate(0, r * 0.4, 0);
    P.add(b, 0x6b7078, 0, 0, 0, (k / 5) * Math.PI * 2, 0, 0); b.dispose();
  }
  for (let k = 0; k < lugs; k++) {
    const b = bx(w * 1.02, r * 0.18, r * 0.24); b.translate(0, r + 0.01, 0);
    P.add(b, 0x141414, 0, 0, 0, (k / lugs) * Math.PI * 2, 0, 0); b.dispose();
  }
  return (wheelCache[key] = P.merge());
}

let MATS = null;
function getMats() {
  if (MATS) return MATS;
  const e = ENV ? 1 : 0;
  MATS = {
    paint: new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: e ? 0.6 : 0.1, roughness: 0.28, envMap: ENV }),
    glass: new THREE.MeshStandardMaterial({ color: 0x0b1622, metalness: e ? 0.9 : 0.2, roughness: 0.06, envMap: ENV, transparent: true, opacity: 0.88 }),
    trim:  new THREE.MeshStandardMaterial({ vertexColors: true, metalness: e ? 0.35 : 0.1, roughness: 0.5, envMap: ENV }),
    lights: new THREE.MeshBasicMaterial({ vertexColors: true }),
    wheel: new THREE.MeshStandardMaterial({ vertexColors: true, metalness: e ? 0.4 : 0.1, roughness: 0.55, envMap: ENV })
  };
  return MATS;
}

function makeGroup(P, wheels, lift = 0) {
  const g = new THREE.Group(), M = getMats();
  const put = (parts, mat, name, isBody, shadow = true, y = lift) => {
    if (!parts || !parts.list.length) return;
    const geo = parts.merge(); if (!geo) return;
    const m = new THREE.Mesh(geo, mat);
    m.name = name; m.castShadow = shadow; m.position.y = y;
    if (isBody) m.userData.isBody = true;
    g.add(m);
  };
  put(P.body, M.paint, 'body', true);
  put(P.glass, M.glass, 'glass', false, false);
  put(P.trim, M.trim, 'trim', false);
  put(P.lights, M.lights, 'lights', false, false);
  put(P.under, M.trim, 'under', false, true, 0);
  for (const w of wheels) {
    const m = new THREE.Mesh(w.geo, M.wheel);
    m.position.set(w.x, w.y, w.z); m.name = 'wheel'; m.castShadow = true; g.add(m);
  }
  g.userData.spin = -1;                  // front is -Z, so wheels roll with decreasing rotation.x
  return g;
}
const newP = () => ({ body: new Parts(), glass: new Parts(), trim: new Parts(), lights: new Parts(), under: new Parts() });

/* ---------- cars (extruded side profiles) ---------- */
function carLike(o) {
  const L = o.L, W = o.W, hl = L / 2, P = newP();
  const pts = [[-hl, o.ride], [-hl, o.trunkH * 0.78]];
  if (o.cabRear > -hl + 0.32) pts.push([-hl + 0.28, o.trunkH]);
  pts.push([o.cabRear, o.hb], [o.cabFront, o.hb], [hl - 0.4, o.noseH], [hl, o.noseLow], [hl, o.ride]);
  P.body.addM(profileGeo(pts, W, 0.05), 0xffffff, I4);
  P.glass.addM(profileGeo([[o.cabRear + 0.06, o.hb - 0.02], [o.roofRear, o.hb + o.roofH], [o.roofFront, o.hb + o.roofH], [o.cabFront - 0.06, o.hb - 0.02]], W * 0.86, 0.02), 0x000000, I4);
  const rl = o.roofFront - o.roofRear, rmid = -(o.roofFront + o.roofRear) / 2;
  P.body.add(bx(W * 0.86, 0.06, rl + 0.04), 0xffffff, 0, o.hb + o.roofH + 0.015, rmid);
  const nz = (o.noseH + o.noseLow) / 2, hy = nz + 0.05;
  const hu = hl - 0.4 + 0.4 * ((o.noseH - hy) / (o.noseH - o.noseLow));
  P.trim.add(bx(W * 0.98, 0.16, 0.12), 0x15171a, 0, o.ride + 0.1, -hl + 0.02);
  P.trim.add(bx(W * 0.98, 0.16, 0.12), 0x15171a, 0, o.ride + 0.1, hl - 0.02);
  P.trim.add(bx(W * 0.5, 0.14, 0.06), 0x08090a, 0, nz - 0.06, -hl - 0.005);
  const wheels = [];
  for (const s of [-1, 1]) {
    P.trim.add(bx(0.16, 0.1, 0.22), 0x15171a, s * (W * 0.43 + 0.1), o.hb + 0.05, -(o.cabFront - 0.4));
    P.lights.add(bx(0.42, 0.1, 0.09), 0xfff6d8, s * W * 0.3, hy, -hu - 0.01);
    P.lights.add(bx(0.5, 0.1, 0.07), 0xd01010, s * W * 0.3, (o.trunkH * 0.78 + o.ride) / 2 + 0.12, hl - 0.01);
    for (const z of [-o.zf, o.zr]) {
      P.trim.add(new THREE.CylinderGeometry(o.wr + 0.06, o.wr + 0.06, 0.06, 20), 0x0a0a0a, s * (W / 2), o.wr, z, 0, 0, Math.PI / 2);
      wheels.push({ x: s * (W / 2 - o.ww / 2 + 0.06), y: o.wr, z, geo: wheelGeo(o.wr, o.ww) });
    }
  }
  if (o.extra) o.extra(P, { L, W, hl, rl, rmid });
  return makeGroup(P, wheels);
}
const buildCoupe = () => carLike({

/* ---------- pickup / monster truck ---------- */
function buildPickup(monster) {
  const W = monster ? 2.3 : 2.0, hl = 2.7, P = newP();
  const lift = monster ? 1.0 : 0;
  P.body.addM(profileGeo([[-hl, 0.45], [-hl, 1.02], [-0.55, 1.02], [-0.5, 1.12], [1.6, 1.12], [2.25, 0.98], [hl, 0.78], [hl, 0.45]], W, 0.05), 0xffffff, I4);
  P.glass.addM(profileGeo([[-0.45, 1.1], [-0.35, 1.78], [0.45, 1.8], [0.95, 1.1]], W * 0.86, 0.02), 0x000000, I4);
  P.body.add(bx(W * 0.86, 0.06, 0.9), 0xffffff, 0, 1.82, -0.05);
  P.body.add(bx(W * 0.88, 0.72, 0.08), 0xffffff, 0, 1.47, 0.5);                     // cab rear wall
  for (const s of [-1, 1]) P.body.add(bx(0.09, 0.5, 2.0), 0xffffff, s * (W / 2 - 0.05), 1.3, 1.65);   // bed sides
  P.body.add(bx(W, 0.5, 0.1), 0xffffff, 0, 1.3, hl - 0.05);                          // tailgate
  P.body.add(bx(W * 0.95, 0.55, 0.1), 0xffffff, 0, 1.32, 0.62);                      // headboard
  P.trim.add(bx(W * 0.88, 0.04, 1.95), 0x1a1c20, 0, 1.045, 1.65);                    // bed liner
  P.trim.add(bx(W, 0.2, 0.18), 0x15171a, 0, 0.55, -hl + 0.02);
  P.trim.add(bx(W, 0.18, 0.14), 0xaeb4ba, 0, 0.5, hl);
  P.trim.add(bx(W * 0.5, 0.2, 0.06), 0x08090a, 0, 0.88, -hl - 0.005);
  for (const s of [-1, 1]) {
    P.trim.add(bx(0.16, 0.1, 0.22), 0x15171a, s * (W * 0.43 + 0.1), 1.2, -0.3);
    P.lights.add(bx(0.45, 0.14, 0.09), 0xfff6d8, s * W * 0.32, 0.92, -hl + 0.02);
    P.lights.add(bx(0.12, 0.3, 0.07), 0xd01010, s * (W / 2 - 0.1), 1.05, hl + 0.01);
  }
  const wheels = [], wr = monster ? 0.95 : 0.43, ww = monster ? 0.8 : 0.32, zz = monster ? 1.75 : 1.65;
  const wx = monster ? 1.45 : W / 2 - ww / 2 + 0.06;
  for (const s of [-1, 1]) for (const z of [-zz, zz]) {
    wheels.push({ x: s * wx, y: wr, z, geo: wheelGeo(wr, ww, 0xc9ced4, monster ? 14 : 0) });
    if (!monster) P.trim.add(new THREE.CylinderGeometry(wr + 0.06, wr + 0.06, 0.06, 20), 0x0a0a0a, s * (W / 2), wr, z, 0, 0, Math.PI / 2);
  }
  if (monster) {
    for (const z of [-zz, zz]) {
      P.under.add(bx(2.9, 0.22, 0.22), 0x2a2d33, 0, 0.95, z);
      for (const s of [-1, 1]) P.under.limb([s * 1.0, 0.95, z], [s * 0.85, 1.45, z * 0.9], 0.07, 0xd4a017);   // shocks
    }
    P.under.add(bx(1.4, 0.2, 3.6), 0x2a2d33, 0, 1.0, 0);
  }
  return makeGroup(P, wheels, lift);
}

/* ---------- cargo truck ---------- */
function buildTruck() {
  const W = 2.5, P = newP();
  P.trim.add(bx(W * 0.78, 0.25, 7.2), 0x1c1e22, 0, 0.62, 0);
  P.body.addM(profileGeo([[1.0, 0.85], [1.0, 3.0], [2.7, 3.0], [3.15, 2.55], [3.62, 1.7], [3.7, 1.2], [3.7, 0.85]], W * 0.96, 0.05), 0xffffff, I4);
  P.glass.add(bx(W * 0.84, 0.64, 0.04), 0x000000, 0, 2.8, -2.945, Math.PI / 4, 0, 0);
  for (const s of [-1, 1]) {
    P.glass.add(bx(0.05, 0.75, 1.2), 0x000000, s * (W * 0.48 + 0.02), 2.35, -1.85);
    P.trim.add(bx(0.18, 0.5, 0.15), 0x15171a, s * (W * 0.5 + 0.12), 2.5, -2.55);       // mirrors
    P.lights.add(bx(0.42, 0.26, 0.07), 0xfff6d8, s * 0.85, 1.55, -3.72);
    P.lights.add(bx(0.32, 0.36, 0.06), 0xd01010, s * 0.95, 1.0, 3.83);

function buildBike(sport) {

  const sph = (part, r, x, y, z, sx, sy, sz, hex, rx = 0) => part.add(new THREE.SphereGeometry(r, 14, 10), hex, x, y, z, rx, 0, 0, sx, sy, sz);
  // frame / drivetrain
  P.trim.add(bx(0.32, 0.4, 0.55), 0x2b2f36, 0, 0.52, 0.0);
  P.trim.add(bx(0.34, 0.22, 0.3), 0x3a3f47, 0, 0.78, -0.05);
  P.trim.limb([0, 1.0, fz + 0.28], [0, 0.82, rz - 0.3], 0.06, dark);

    P.trim.limb([s * 0.1, wr, rz], [s * 0.1, 0.55, 0.0], 0.03, dark);                            // swingarm
    P.trim.limb([s * 0.2, 0.35, -0.2], [s * 0.22, sport ? 0.45 : 0.4, rz + 0.3], 0.055, chrome);  // exhaust
    P.trim.limb([s * (sport ? 0.32 : 0.3), sport ? 1.17 : 1.35, fz + 0.3], [0, sport ? 1.17 : 1.2, fz + 0.3], 0.022, dark);
  }
  P.trim.add(bx(0.3, 0.09, 0.6), 0x15171a, 0, sport ? 0.88 : 0.78, 0.38);                        // seat
  // bodywork
  if (sport) {
    sph(P.body, 1, 0, 1.02, -0.18, 0.19, 0.17, 0.36, 0xffffff);          // tank
    sph(P.body, 1, 0, 0.92, -0.58, 0.22, 0.28, 0.42, 0xffffff);          // fairing

    sph(P.body, 1, 0, wr + 0.18, fz, 0.12, 0.06, 0.32, 0xffffff);        // front fender
    for (const s of [-1, 1]) P.body.add(bx(0.14, 0.28, 0.55), 0xffffff, s * 0.3, 0.62, 0.75);   // saddle bags
  }
  P.lights.add(new THREE.SphereGeometry(sport ? 0.1 : 0.12, 10, 8), 0xfff6d8, 0, sport ? 0.97 : 1.1, fz - 0.12);
  P.lights.add(bx(0.2, 0.06, 0.04), 0xd01010, 0, sport ? 0.97 : 0.8, rz + 0.33);
  // rider
  const hip = sport ? [0, 0.98, 0.35] : [0, 0.9, 0.3];
  const sh  = sport ? [0, 1.42, -0.05] : [0, 1.5, 0.18];
  P.trim.limb(hip, sh, 0.15, suit, 10);
  sph(P.body, 1, 0, sport ? 1.62 : 1.72, sport ? -0.12 : 0.14, 0.13, 0.14, 0.15, 0xffffff);        // helmet (paint colour)
  P.glass.add(bx(0.14, 0.06, 0.1), 0x000000, 0, sport ? 1.62 : 1.72, sport ? -0.24 : 0.02);
  for (const s of [-1, 1]) {
    const hand = [s * 0.3, sport ? 1.17 : 1.35, fz + 0.3];
    const elbow = sport ? [s * 0.3, 1.22, -0.3] : [s * 0.3, 1.25, -0.2];
    P.trim.limb([s * 0.17, sh[1] - 0.02, sh[2]], elbow, 0.05, suit);
    P.trim.limb(elbow, hand, 0.045, suit);

 *  Merged into 3 meshes per tile, repeated and scrolled with modulo wrap-around.
 * ================================================================== */
const TILE = 132, SP = 22;
/*TILE-BEGIN*/
function buildTileGeometries() {
  const main = new Parts(), win = new Parts(), bulb = new Parts();
  const palette = [0x8d99ae, 0xb08968, 0xa9b4c2, 0xc9ada7, 0x7c8ea3, 0xd4a373, 0x9aa5b1, 0xb5838d];
  const greens = [0x2f7d3a, 0x3f9a46, 0x2a6b34, 0x4aa850];
  const R = Math.random;
  for (let j = 0; j < TILE / SP; j++) {
    const z0 = 25 - j * SP;
    for (const s of [-1, 1]) {
      const w = 6 + R() * 4, d = 9 + R() * 3, h = 8 + R() * 18;
      const x = s * (15 + w / 2 + R() * 3), zc = z0 - SP / 2;
      main.add(bx(w, h, d), palette[(R() * palette.length) | 0], x, h / 2, zc);
      main.add(bx(w + 0.4, 0.4, d + 0.4), 0x6c7480, x, h + 0.2, zc);                       // roof slab
      for (let y = 3; y < h - 1.5; y += 3.2) {
        const lit = R() < 0.62 ? 1.0 : 0.45;
        win.add(bx(0.1, 1.3, d * 0.8), new THREE.Color(lit, lit, lit).getHex(), x - s * (w / 2 + 0.03), y, zc);
      }
      // street light
      main.add(new THREE.CylinderGeometry(0.12, 0.12, 7, 6), 0x444b52, s * 8.4, 3.5, z0);
      main.add(bx(2.6, 0.15, 0.15), 0x444b52, s * 7.1, 7, z0);
      bulb.add(new THREE.SphereGeometry(0.3, 8, 6), 0xfff2a8, s * 5.9, 6.85, z0);
      // trees between road and buildings
      for (let t = 0; t < 2; t++) {
        const tz = z0 - 4 - t * 10 + R() * 3, tx = s * (10.2 + R() * 2.4), th = 2.2 + R() * 1.8, gc = greens[(R() * greens.length) | 0];
        main.add(new THREE.CylinderGeometry(0.16, 0.22, th * 0.5, 6), 0x5a3d26, tx, th * 0.25, tz);
        if (R() < 0.5) {
          main.add(new THREE.ConeGeometry(1.2, th * 0.9, 7), gc, tx, th * 0.5 + th * 0.4, tz);
          main.add(new THREE.ConeGeometry(0.9, th * 0.7, 7), gc, tx, th * 0.5 + th * 0.85, tz);
        } else {
          main.add(new THREE.SphereGeometry(1.15, 8, 6), gc, tx, th * 0.5 + 0.9, tz, 0, 0, 0, 1, 1.1, 1);
        }
      }
    }
  }
  for (const s of [-1, 1]) {                                                                   // guard rails
    main.add(bx(0.1, 0.28, TILE), 0xb8bec4, s * 7.4, 0.66, 25 - TILE / 2);
    for (let z = 25; z > 25 - TILE; z -= 4.4) main.add(new THREE.CylinderGeometry(0.05, 0.05, 0.7, 5), 0x6d747b, s * 7.4, 0.35, z);
  }
  for (const [j, s] of [[1, 1], [4, -1]]) {                                                    // traffic lights
    const z = 25 - j * SP - 11;
    main.add(new THREE.CylinderGeometry(0.15, 0.15, 6.2, 6), 0x2f3338, s * 8, 3.1, z);
    main.add(bx(4.6, 0.18, 0.18), 0x2f3338, s * 5.7, 6.1, z);
    main.add(bx(0.55, 1.6, 0.5), 0x1b1d20, s * 3.5, 5.2, z);
    bulb.add(new THREE.SphereGeometry(0.17, 8, 6), 0xff2a2a, s * 3.5, 5.7, z + 0.27);
    bulb.add(new THREE.SphereGeometry(0.17, 8, 6), 0x5a4a10, s * 3.5, 5.2, z + 0.27);
    bulb.add(new THREE.SphereGeometry(0.17, 8, 6), 0x0f4a1f, s * 3.5, 4.7, z + 0.27);
  }
  return { main: main.merge(), win: win.merge(), bulb: bulb.merge() };
}
/*TILE-END*/

let template = null;

function prepareTemplate(model) {
  let bestMesh = null, bestVol = 0, hasBody = false;
  model.traverse(o => {
    if (!o.isMesh) return;
    const old = o.material;
    const on = (o.name || '').toLowerCase(), mn = (old.name || '').toLowerCase();
    const isGlass = on === 'glass' || mn === 'glass', isBody = on === 'body' || mn === 'body';
    const m = new THREE.MeshStandardMaterial({
      color: old.color ? old.color.clone() : new THREE.Color(0xffffff), map: old.map || null,
      metalness: isBody ? 0.6 : (typeof old.metalness === 'number' ? old.metalness : 0.3),
      roughness: isBody ? 0.28 : (typeof old.roughness === 'number' ? old.roughness : 0.5),
      envMap: ENV, transparent: old.transparent, opacity: old.opacity, side: old.side,
      emissive: old.emissive ? old.emissive.clone() : new THREE.Color(0x000000),
      emissiveIntensity: typeof old.emissiveIntensity === 'number' ? old.emissiveIntensity : 1
    });
    m.name = old.name;
    o.material = m; o.castShadow = true;
    if (isGlass) { m.color.set(0x0b1622); m.transparent = true; m.opacity = 0.62; m.metalness = 0.9; m.roughness = 0.05; o.castShadow = false; }
    else if (isBody) { o.userData.isBody = true; hasBody = true; }
    else if (!/wheel|rim|tire|tyre/.test(on)) {
      o.geometry.computeBoundingBox();
      const s = o.geometry.boundingBox.getSize(new THREE.Vector3());
      const vol = s.x * s.y * s.z;
      if (vol > bestVol) { bestVol = vol; bestMesh = o; }
    }
  });
  if (!hasBody && bestMesh) bestMesh.userData.isBody = true;

  model.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  model.scale.setScalar(4.3 / Math.max(size.x, size.z));
  model.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(model);
  const ctr = box.getCenter(new THREE.Vector3());
  model.position.x -= ctr.x; model.position.z -= ctr.z; model.position.y -= box.min.y;
  model.updateMatrixWorld(true);

  const wc = n => { const w = model.getObjectByName(n); return w ? new THREE.Box3().setFromObject(w).getCenter(new THREE.Vector3()) : null; };
  let frontPlusZ = true;
  const fl = wc('wheel_fl'), rl = wc('wheel_rl'), fr = wc('wheel_fr'), rr = wc('wheel_rr');
  if (fl && rl && Math.abs(fl.z - rl.z) > 0.1) frontPlusZ = fl.z > rl.z;
  else if (fr && rr && Math.abs(fr.z - rr.z) > 0.1) frontPlusZ = fr.z > rr.z;

  const root = new THREE.Group();
  root.add(model);
  if (frontPlusZ) root.rotation.y = Math.PI;
  root.userData.spin = frontPlusZ ? 1 : -1;
  return root;
}

function loadFerrari() {
  return new Promise((resolve, reject) => {
    const draco = new DRACOLoader();
    draco.setDecoderPath(DRACO_PATH);
    const loader = new GLTFLoader();
    loader.setDRACOLoader(draco);
    loader.load(FERRARI_URL, gltf => { try { resolve(prepareTemplate(gltf.scene)); } catch (e) { reject(e); } }, undefined, reject);
  });
}

function fallbackCar() {                       // simple red box car (used if the GLB cannot load)
  const g = new THREE.Group();
  const mk = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  const bodyM = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.5, roughness: 0.3, envMap: ENV });
  const dark = new THREE.MeshStandardMaterial({ color: 0x1b2733, metalness: 0.8, roughness: 0.1, envMap: ENV });
  const tire = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const white = new THREE.MeshBasicMaterial({ color: 0xffffee }), red = new THREE.MeshBasicMaterial({ color: 0xff2020 });
  mk(bx(1.9, 0.6, 4.2), bodyM, 0, 0.65, 0).userData.isBody = true;
  mk(bx(1.5, 0.5, 2.0), dark, 0, 1.2, 0.2);
  for (const sx of [-1, 1]) {
    for (const sz of [-1.35, 1.35]) { const w = mk(new THREE.CylinderGeometry(0.38, 0.38, 0.3, 14).rotateZ(Math.PI / 2), tire, sx * 1.0, 0.38, sz); w.name = 'wheel'; }
    mk(bx(0.4, 0.2, 0.1), white, sx * 0.6, 0.7, -2.1);
    mk(bx(0.4, 0.2, 0.1), red, sx * 0.6, 0.7, 2.1);
  }
  g.userData.spin = -1;
  return g;
}

function getProto(def) {
  if (def.proto) return def.proto;
  try {
    def.proto = def.glb ? (template || fallbackCar()) : def.build();
  } catch (e) {
    console.warn('vehicle build failed: ' + def.id, e);
    def.proto = fallbackCar();
  }
  return def.proto;
}
function makeVehicle(def, color) {
  const proto = getProto(def);
  const g = proto.clone(true);
  const wheels = [];
  g.traverse(o => {
    if (o.isMesh && o.userData.isBody) { o.material = o.material.clone(); o.material.color.set(color); }
    if (o.name === 'wheel' || (template && def.glb && /^wheel_(fl|fr|rl|rr)$/.test(o.name))) wheels.push(o);
  });
  g.userData.wheels = wheels;
  return g;
}

/* ================================================================== *
 *  Coin: thick metallic disc, reeded edge, embossed star
 * ================================================================== */
function makeCoinFace() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(100, 90, 10, 128, 128, 140);
  grd.addColorStop(0, '#fff3a0'); grd.addColorStop(0.5, '#ffd23a'); grd.addColorStop(1, '#c58a0a');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  g.fillStyle = '#9a6804';
  for (let i = 0; i < 56; i++) { g.save(); g.translate(128, 128); g.rotate((i / 56) * Math.PI * 2); g.fillRect(-2, -126, 4, 10); g.restore(); }
  g.lineWidth = 8; g.strokeStyle = '#b57a06'; g.beginPath(); g.arc(128, 128, 108, 0, Math.PI * 2); g.stroke();
  g.lineWidth = 3; g.strokeStyle = '#fff0a0'; g.beginPath(); g.arc(128, 128, 98, 0, Math.PI * 2); g.stroke();
  const star = (R, r, fill, ox, oy) => {
    g.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, rad = i % 2 ? r : R; g.lineTo(128 + ox + Math.cos(a) * rad, 128 + oy + Math.sin(a) * rad); }
    g.closePath(); g.fillStyle = fill; g.fill();
  };
  star(66, 28, '#8f5f03', 4, 5); star(66, 28, '#ffe27a', 0, 0); star(48, 20, '#f0b520', 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
  return t;
}
const coinGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.12, 28).rotateX(Math.PI / 2);
const coinSide = new THREE.MeshStandardMaterial({ color: 0xd9a21b, metalness: 0.9, roughness: 0.3, envMap: ENV, emissive: 0x3d2600 });
const coinCap = new THREE.MeshStandardMaterial({ map: makeCoinFace(), metalness: 0.85, roughness: 0.32, envMap: ENV, emissive: 0x3d2600 });
const coinMat = [coinSide, coinCap, coinCap];

 *  Entities

let player, playerCar, playerIdx = 0, pv = VEHICLES[0], enemies = [], coins = [], allCars = [];

function setPlayerVehicle(idx) {
  if (playerCar) player.remove(playerCar);
  playerIdx = idx; pv = VEHICLES[idx];
  playerCar = makeVehicle(pv, GARAGE[selectedIdx].c);
  player.add(playerCar);
  allCars[0].car = playerCar;
  PLAYER_LIMIT = 6.0 - pv.hw;
}

function createEntities() {
  player = new THREE.Group();
  scene.add(player);
  player.add(headlight, headlight.target);
  allCars.push({ car: null, enemy: false });
  setPlayerVehicle(curV);

  enemies = ENEMIES.map(en => {
    const def = VEHICLES[vIndex(en.v)];
    const holder = new THREE.Group();
    const car = makeVehicle(def, en.c);
    holder.add(car);
    holder.rotation.y = Math.PI;                       // oncoming: faces the player
    holder.userData = { lane: 1, hw: def.hw, hl: def.hl, drift: null };
    holder.visible = false;
    scene.add(holder);
    allCars.push({ car, enemy: true });
    return holder;
  });

  for (let i = 0; i < NUM_COINS; i++) {
    const c = new THREE.Mesh(coinGeo, coinMat);
    c.userData.ph = Math.random() * 6.28;
    c.visible = false;
    scene.add(c); coins.push(c);
  }

function spawnEnemy(e, z) {
  for (let t = 0; t < 14; t++) {
    const lane = (Math.random() * 3) | 0;
    const occ = new Set();
    for (const o of enemies) {
      if (o === e || !o.visible || o.position.z < -900) continue;
      if (Math.abs(o.position.z - z) < 24) occ.add(o.userData.lane);
    }
    if (!occ.has(lane) && occ.size < 2) { setEnemy(e, lane, z); return; }
    z -= 10;
  }
  setEnemy(e, (Math.random() * 3) | 0, z - 20);
}
function setEnemy(e, lane, z) {
  e.userData.lane = lane;
  e.position.set(LANES[lane], 0, z);
  // harder levels: some oncoming vehicles swerve into the next lane
  const p = Math.min(0.7, Math.max(0, (level - 15) / 100 + 0.1));
  e.userData.drift = level >= 20 && Math.random() < p ? { at: -55 - Math.random() * 45, dir: Math.random() < 0.5 ? -1 : 1, done: false } : null;
}

function placeCoin(c, zMin, zMax) {
  for (let t = 0; t < 10; t++) {
    const x = LANES[(Math.random() * 3) | 0] + (Math.random() - 0.5) * 1.4;
    const z = zMin + Math.random() * (zMax - zMin);
    let ok = true;
    for (const e of enemies) if (e.visible && Math.abs(e.position.z - z) < 8 && Math.abs(e.position.x - x) < 2.8) { ok = false; break; }
    if (ok) for (const o of coins) if (o !== c && o.visible && Math.abs(o.position.z - z) < 2.5 && Math.abs(o.position.x - x) < 2) { ok = false; break; }
    if (ok || t === 9) { c.position.set(x, 1, z); c.visible = true; return; }
  }
}

/* ================================================================== *
 *  State, HUD, screens

const elScore = el('score');
let state = 'loading';
let score = 0, levelCoins = 0, traveled = 0, carX = 0, vx = 0, time = 0, shake = 0, cleared = 1, lastProg = -1;
const input = { left: false, right: false };

function toast(msg, ms = 2600) {
  const t = el('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
function updateWallet() { document.querySelectorAll('.walletVal').forEach(n => { n.textContent = wallet; }); }
function addCoins(n) { wallet += n; store.set('ferrariRushWallet', wallet); updateWallet(); }
function updateHUD() {

}
function updateProgress() {

  if (p !== lastProg) { lastProg = p; el('progFill').style.width = p + '%'; }
}

const OVERLAYS = { home: 'home', paused: 'pause', garage: 'garage', roads: 'roads', levels: 'levels', over: 'gameover', win: 'levelwin' };
function setUI(mode) {
  for (const [m, id] of Object.entries(OVERLAYS)) el(id).classList.toggle('hidden', m !== mode);
  const inGame = mode === 'playing' || mode === 'paused' || mode === 'over' || mode === 'win';
  el('hud').style.display = inGame ? 'flex' : 'none';
  el('levelTag').classList.toggle('hidden', !inGame);
  el('prog').classList.toggle('hidden', !inGame);
  el('speedo').classList.toggle('hidden', mode !== 'playing');
  el('btnPause').classList.toggle('hidden', mode !== 'playing');
  el('controls').style.display = mode === 'playing' ? 'flex' : 'none';
  el('hint').classList.toggle('hidden', mode !== 'playing');
}

function reset(keepScore = false) {
  if (playerIdx !== curV) setPlayerVehicle(curV);
  if (!keepScore) score = 0;
  traveled = 0; levelCoins = 0; carX = 0; vx = 0; shake = 0; lastProg = -1;
  SPEED = levelSpeed(level); ENEMY_EXTRA = levelExtra(level);
  PLAYER_LIMIT = 6.0 - pv.hw;
  input.left = input.right = false;
  player.position.set(0, 0, 0); player.rotation.set(0, 0, 0);
  gate.visible = false;
  drawBanner(routeTo(level));
  const active = levelEnemies(level);
  enemies.forEach((e, i) => { e.visible = i < active; e.position.z = -1000; e.userData.drift = null; });
  enemies.forEach((e, i) => { if (i < active) spawnEnemy(e, -70 - i * 24 - Math.random() * 10); });
  coins.forEach(c => placeCoin(c, -15, -170));
  state = 'playing';
  setUI('playing');
  el('speedo').textContent = Math.round(SPEED * 3.6) + ' km/h';
  updateHUD(); updateProgress();
  toast('LEVEL ' + level + '  •  ' + routeFrom(level) + ' → ' + routeTo(level));
}

function saveBest() { if (score > best) { best = score; store.set('ferrariRushBest', best); } }

function gameOver() {
  state = 'over';
  shake = 0.6;
  saveBest();
  const pct = Math.min(99, Math.floor((traveled / levelDist(level)) * 100));
  el('finalScore').textContent = 'Level ' + level + ' • ' + pct + '% to ' + routeTo(level) + ' • Score ' + score;
  setUI('over');
}

function levelComplete() {
  state = 'win';
  cleared = level;
  const bonus = levelBonus(level);
  addCoins(bonus);
  score += 50;
  saveBest();
  if (level < MAX_LEVEL) {
    level++;
    unlocked = Math.max(unlocked, level);
    store.set('ferrariRushUnlocked', unlocked);
    store.set('ferrariRushLevel', level);
  }
  updateHUD();
  el('winTitle').textContent = cleared >= MAX_LEVEL ? 'YOU WIN! \u{1F3C6}' : 'REACHED ' + routeTo(cleared).toUpperCase() + '!';
  el('finalScore2').textContent = 'Level ' + cleared + ' clear • +' + bonus + ' bonus coins • collected ' + levelCoins + ' • Score ' + score;
  el('winNext').classList.toggle('hidden', cleared >= MAX_LEVEL);
  setUI('win');
}

function parkWorld() {
  input.left = input.right = false;
  carX = 0; vx = 0; shake = 0;
  SPEED = levelSpeed(level);
  player.position.set(0, 0, 0); player.rotation.set(0, 0, 0);
  gate.visible = false;
  enemies.forEach(e => { e.visible = false; });
  coins.forEach(c => { c.visible = false; });
}
function refreshHome() {
  el('bestLine').textContent = 'Best: ' + best + '   •   Levels: ' + unlocked + '/' + MAX_LEVEL;
  el('homeStart').innerHTML = '&#9654; START &nbsp;•&nbsp; LEVEL ' + level;
  el('homeQuality').textContent = '⚙ GRAPHICS: ' + QUALITY[qIdx].n;

}
function goHome() {

  refreshHome(); setUI('home');
}
function openGarage() {

  refreshGarage(); setUI('garage');
}
function openRoads() {

}
function openLevels() { state = 'levels'; parkWorld(); buildLevels(); setUI('levels'); }
function pauseGame() { if (state === 'playing') { state = 'paused'; input.left = input.right = false; setUI('paused'); } }
function resumeGame() { if (state === 'paused') { state = 'playing'; setUI('playing'); } }
function nextLevel() { reset(true); }        // `level` was already advanced in levelComplete()

/* ---- garage (vehicles + colours) ---- */
function applyPlayerColor(hex) { playerCar.traverse(o => { if (o.isMesh && o.userData.isBody) o.material.color.set(hex); }); }
function selectColor(i, silent) {

  applyPlayerColor(GARAGE[i].c);
  [...el('swatches').children].forEach((b, k) => b.classList.toggle('sel', k === i));
  if (!silent) store.set('ferrariRushColor', i);

function stars5(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }
function refreshGarage() {
  const v = VEHICLES[previewV], owned = ownedV.includes(v.id);
  [...el('vcards').children].forEach((b, k) => {
    const vv = VEHICLES[k], o = ownedV.includes(vv.id);
    b.classList.toggle('sel', k === previewV);

    b.querySelector('.vp').textContent = o ? (k === curV ? '✔ EQUIPPED' : 'OWNED') : '\u{1F512} ' + vv.price;
  });
  el('vName').textContent = v.n;
  el('vStats').textContent = 'Handling ' + stars5(v.hnd) + '  •  Size ' + v.size + (v.lean ? '  •  Leans into turns' : '');
  const a = el('vAction');
  a.classList.remove('buy', 'off');

  else if (wallet >= v.price) { a.textContent = 'BUY • ' + v.price + ' coins'; a.classList.add('buy'); }
  else { a.textContent = 'NEED ' + (v.price - wallet) + ' MORE COINS'; a.classList.add('off'); }

/* ---- levels / quality ---- */
function buildLevels() {
  const grid = el('lvgrid');

    const b = document.createElement('button');
    b.className = 'lv' + (i > unlocked ? ' lock' : '') + (i === level ? ' cur' : '');

    grid.appendChild(b);

function cycleQuality() {
  qIdx = (qIdx + 1) % QUALITY.length;
  store.set('ferrariRushQ', qIdx);
  applyQuality(qIdx);
  refreshHome();
  toast('Graphics: ' + QUALITY[qIdx].n);
}
// Adaptive quality: if the device cannot hold ~40 fps, quietly step the graphics down.
let fpsAcc = 0, fpsN = 0;
function monitorFps(dt) {
  if (userChoseQ || qIdx === 0) return;
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 3) {
    const fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
    if (fps < 38) { qIdx--; applyQuality(qIdx); toast('Graphics adjusted for smooth play: ' + QUALITY[qIdx].n); }
  }
}

function idle(dt) {                                  // slow scenery scroll behind menus
  const d = SPEED * 0.3 * dt;
  roadTex.offset.y = (roadTex.offset.y + d / 10) % 1;
  kerbTex.offset.y = (kerbTex.offset.y + d / 2) % 1;
  scenery.position.z = (scenery.position.z + d) % TILE;
  spinWheels(playerCar, 8 * dt);
}
function spinWheels(car, amount) {
  const w = car.userData.wheels;
  if (w && w.length) { const a = car.userData.spin * amount; for (const x of w) x.rotation.x += a; }
}

/* ================================================================== *
 *  Input
 * ================================================================== */
window.addEventListener('keydown', e => {
  const onButton = e.target && e.target.tagName === 'BUTTON';
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { input.left = true; e.preventDefault(); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { input.right = true; e.preventDefault(); }
  else if (e.code === 'KeyP' || e.code === 'Escape') {
    if (state === 'playing') pauseGame(); else if (state === 'paused') resumeGame();
    e.preventDefault();
  }
  else if ((e.code === 'Enter' || e.code === 'Space') && !onButton) {
    if (state === 'over' || state === 'home') { reset(); e.preventDefault(); }
    else if (state === 'win') { nextLevel(); e.preventDefault(); }
    else if (state === 'paused') { resumeGame(); e.preventDefault(); }
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
});
window.addEventListener('blur', () => { input.left = input.right = false; });

function bindHold(id, key) {
  const b = el(id);
  const on = e => { e.preventDefault(); input[key] = true; b.classList.add('down'); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = e => { e.preventDefault(); input[key] = false; b.classList.remove('down'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
}
bindHold('btnLeft', 'left');
bindHold('btnRight', 'right');

function tap(id, fn) {                               // plain click, then blur so Space/Enter never double-fire
  const b = el(id);
  b.addEventListener('click', e => { e.preventDefault(); b.blur(); fn(); });
}
tap('homeStart', () => reset());      tap('homeLevels', openLevels);   tap('homeGarage', openGarage);
tap('homeRoads', openRoads);          tap('homeQuality', cycleQuality);
tap('btnPause', pauseGame);           tap('pResume', resumeGame);      tap('pRestart', () => reset());   tap('pHome', goHome);
tap('playAgain', () => reset());      tap('btnGoHome', goHome);        tap('btnGoLevels', openLevels);   tap('btnGoGarage', openGarage);
tap('winNext', nextLevel);            tap('winHome', goHome);          tap('winGarage', openGarage);     tap('winLevels', openLevels);
tap('levelsBack', goHome);            tap('garageBack', goHome);       tap('roadsBack', goHome);
tap('vAction', vehicleAction);        tap('rAction', roadAction);

document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
document.addEventListener('touchmove', e => {         // block page scroll/zoom, except inside scrollable menus
  if (!(e.target.closest && e.target.closest('.overlay, .lvgrid, .hscroll'))) e.preventDefault();
}, { passive: false });

/* ================================================================== *
 *  Update / render loop
 * ================================================================== */
function update(dt) {
  const d = SPEED * dt;
  traveled += d;

  roadTex.offset.y = (roadTex.offset.y + d / 10) % 1;
  kerbTex.offset.y = (kerbTex.offset.y + d / 2) % 1;
  scenery.position.z = (scenery.position.z + d) % TILE;
  updateProgress();

  // steering (per-vehicle handling), clamped to the road
  const steer = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  vx += (steer * MAX_VX * pv.steer - vx) * Math.min(1, dt * 9);
  carX += vx * dt;
  if (carX > PLAYER_LIMIT) { carX = PLAYER_LIMIT; vx = 0; }
  else if (carX < -PLAYER_LIMIT) { carX = -PLAYER_LIMIT; vx = 0; }
  player.position.x = carX;
  player.rotation.y = -vx * 0.022;
  player.rotation.z = pv.lean ? -vx * 0.03 : 0;      // bikes lean into the turn

  // destination gate
  const remaining = levelDist(level) - traveled;
  if (!gate.visible && remaining <= 200) { gate.visible = true; gate.position.z = -Math.max(remaining, 10); }
  else if (gate.visible) {
    gate.position.z += d;
    if (gate.position.z >= -0.5) { levelComplete(); return; }
  }

  // coins
  for (const c of coins) {
    if (!c.visible) continue;
    c.position.z += d;
    c.position.y = 1 + Math.sin(time * 5 + c.userData.ph) * 0.12;
    c.rotation.y += dt * 4;
    if (Math.abs(c.position.x - carX) < pv.hw + 0.7 && Math.abs(c.position.z) < Math.min(pv.hl, 2.6) + 0.3) {
      levelCoins++; score += 10; addCoins(1);
      c.visible = false;                                   // coin disappears...
      if (!gate.visible) placeCoin(c, -110, -175);         // ...and a new one spawns ahead
      updateHUD();
    } else if (c.position.z > NEAR_RESET) {
      if (gate.visible) { c.visible = false; c.position.z = -1000; } else placeCoin(c, -150, -180);
    }
  }

  // oncoming traffic (swept test so even 230 km/h can never tunnel through the player)
  const es = SPEED + ENEMY_EXTRA;
  for (const e of enemies) {
    if (!e.visible) continue;
    const ud = e.userData, zPrev = e.position.z;
    e.position.z += es * dt;
    if (ud.drift && !ud.drift.done && e.position.z > ud.drift.at) {
      const tl = Math.max(0, Math.min(2, ud.lane + ud.drift.dir)), tx = LANES[tl];
      const step = 3.4 * dt, dx = tx - e.position.x;
      if (Math.abs(dx) <= step) { e.position.x = tx; ud.lane = tl; ud.drift.done = true; } else e.position.x += Math.sign(dx) * step;
    }
    if (e.position.z > NEAR_RESET + ud.hl) {
      if (gate.visible) { e.visible = false; e.position.z = -1000; } else spawnEnemy(e, -180 - Math.random() * 30);
      continue;
    }
    const win = pv.hl + ud.hl - 0.45;
    if (zPrev < win && e.position.z > -win && Math.abs(e.position.x - carX) < pv.hw + ud.hw - 0.12) { gameOver(); return; }
  }

  for (const a of allCars) if (a.car) spinWheels(a.car, (a.enemy ? es : SPEED) * 1.2 * dt);
}

function updateCamera(dt) {
  if (state === 'garage') {                           // showroom: turntable view, framed by vehicle size
    const k = Math.max(1, pv.hl / 2.4);
    camera.position.set(2.6 * k, 1.9 * k, 6.4 * k);
    camera.lookAt(0, 0.9, 0);
    return;
  }
  const cx = carX * camCfg.follow;
  camera.position.set(cx, camCfg.y + pv.cam * 0.7, camCfg.z + pv.cam * 1.4);
  if (shake > 0) {
    camera.position.x += (Math.random() - 0.5) * shake;
    camera.position.y += (Math.random() - 0.5) * shake;
    shake = Math.max(0, shake - dt * 1.5);
  }
  camera.lookAt(cx, camCfg.lookY, camCfg.lookZ);
  const targetFov = camCfg.fov + (state === 'playing' ? Math.min(9, Math.max(0, (SPEED - 28) * 0.12)) : 0);
  if (Math.abs(camera.fov - targetFov) > 0.05) { camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix(); }
}

const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.04);
  time += dt;
  if (state === 'playing') { update(dt); monitorFps(dt); }
  else if (state === 'garage') player.rotation.set(0, time * 0.8, 0);
  else if (state === 'home' || state === 'roads' || state === 'levels') idle(dt);
  for (const c of clouds) { c.position.x += dt * 2.5; if (c.position.x > 420) c.position.x = -420; }
  sky.position.x = camera.position.x;
  updateCamera(dt);
  renderer.render(scene, camera);
}

/* ================================================================== *
 *  Boot: Ferrari GLB (12 s timeout) -> fallback box car
 * ================================================================== */
async function init() {
  try {
    template = await Promise.race([
      loadFerrari(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('GLB load timeout')), 12000))
    ]);
  } catch (err) {
    console.warn('Ferrari model failed to load, using fallback car:', err);
    template = null;
  }
  createEntities();
  buildGarage();
  buildRoadCards();
  applyRoad(curRoad);
  goHome();
  el('loading').classList.add('hidden');
  clock.getDelta();
  renderer.setAnimationLoop(loop);
}
init();
</script>
</body>
