  ud.tm.emissiveIntensity=(state==='play'&&(br||hb))?3:.5;
  ud.hm.emissiveIntensity=lightsOn?1.6:.05;ud.beam.visible=lightsOn&&THEMES[themeK].pool>.2;
  $('wsvg').style.transform=`rotate(${steer*180}deg)`;
  marker.material.opacity=.25+.15*Math.sin(t/260);arrow.position.y=3.4+Math.sin(t/300)*.35;arrow.rotation.y+=dt*2;
  moon.position.set(x+SP[0],SP[1],z+SP[2]);moon.target.position.set(x,0,z);
  if((hudT+=dt)>.1){hudT=0;const s=`<div class="spd"><b>${Math.abs(v*3.6)|0}</b><small>km/h</small><span class="gr">${gear>0?'D':gear<0?'R':'N'}</span></div><div class="meta"><span>${IC('clock')}${Math.max(0,timeLeft|0)}s</span><span>${IC('crash')}${hits}/${MH()}</span><span>LV ${lvl}</span></div>`;if(s!==hudS){hudS=s;$('stats').innerHTML=s;}}
  if(wl!==save.coins){wl=save.coins;$('wallet').innerHTML=COIN(wl);}
  const sm=state!=='menu';if(sm!==mapShow){mapShow=sm;mm.style.display=sm?'block':'none';}
  if(sm&&(++mapT&1))drawMap();
  if(ac){const tt=ac.currentTime,sp=Math.abs(v)/ty.top,gi=Math.min(4,sp*5|0),playing=state==='play';
    const rt=900+(sp*5-gi)*3600+(gasKey&&gear!==0?600:0)+gi*250;rpm+=(rt-rpm)*Math.min(1,dt*7);
    const f=rpm/60*2*ty.pi;engA.frequency.setTargetAtTime(f,tt,.04);engB.frequency.setTargetAtTime(f*2,tt,.04);
    engF.frequency.setTargetAtTime(250+rpm*.35,tt,.05);
    engG.gain.setTargetAtTime(playing?.06+(gasKey?.05:0)+sp*.05:0,tt,.08);
    const slip=playing?(hb&&Math.abs(v)>3?1:Math.max(0,(Math.abs(steer)*Math.abs(v)-8)/6)):0;
    sqG.gain.setTargetAtTime(clamp(slip,0,1)*.12,tt,.05);sqF.frequency.setTargetAtTime(1500+Math.abs(v)*60,tt,.1);
    hornG.gain.setTargetAtTime(hornOn&&playing?.08:0,tt,.02);}
  if(!lookDrag)camYaw*=Math.exp(-dt*2.5);
  let fov=58;
  if(state==='menu'){const a=t/3500;cp.set(x+Math.cos(a)*7.5,2.4,z+Math.sin(a)*7.5);cl.set(x,.8,z);if(snap)camera.position.copy(cp);else camera.position.lerp(cp,1-Math.exp(-dt*6));fov=45;}
  else{
    camH+=wrap(h-camH)*(1-Math.exp(-dt*3));
    if(camMode<=1){const a=camH+camYaw,dist=camMode?13:8.5;cp.set(x-Math.sin(a)*dist,camMode?7.5:3.6,z-Math.cos(a)*dist);cl.set(x+fx*4,1.1,z+fz*4);fov=58+Math.abs(v)*.9;}
    else if(camMode===2){cp.set(x,26,z+5);cl.set(x,0,z);fov=50;}
    else{const a=h-steer*.2+camYaw*.8,e=ty.by+ty.bh/2+ty.ch*.35,ox=x+fx*(ty.cz+.1),oz=z+fz*(ty.cz+.1);
      cp.set(ox,e,oz);cl.set(ox+Math.sin(a)*12,e-.25,oz+Math.cos(a)*12);fov=70;}
    if(camMode===3||snap)camera.position.copy(cp);else camera.position.lerp(cp,1-Math.exp(-dt*7));
  }
  snap=0;shake*=Math.exp(-dt*6);
  if(shake>.01)camera.position.add(V.set((Math.random()-.5)*shake,(Math.random()-.5)*shake,(Math.random()-.5)*shake));
  camera.lookAt(cl);
  if(Math.abs(camera.fov-fov)>.05){camera.fov+=(fov-camera.fov)*Math.min(1,dt*5);camera.updateProjectionMatrix();}
  renderer.render(scene,camera);
  window.__ok=true;
}
setPlayer();newGame();showMenu();requestAnimationFrame(loop);
</script>
